<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Crear Dirección - 1</title>
</head>

<body>
    <div class="container">
        <h1>Crear Dirección</h1>
        <form method="POST">
            <div>
                <label for="descripcion">Descripción:</label>
                <input type="text" id="descripcion" name="descripcion" required>
            </div>
            <div>
                <label for="tipo">Tipo:</label>
                <input type="text" id="tipo" name="tipo" required>
            </div>
            <div>
                <label for="estudiante">Estudiante:</label>
                <select id="estudiante" name="estudiante" required>
                    {% if estudiantes %}
                    {# Se itera sobre la lista de estudiantes obtenida de la API #}
                    {% for estudiante in estudiantes %}
                    {# El 'value' del option debe ser la URL completa del estudiante #}
                    {# ya que tu NumeroTelefonicoSerializer espera un HyperlinkedRelatedField #}
                    <option value="{{ estudiante.url }}">{{ estudiante.nombre }} {{ estudiante.apellido }} ({{
                        estudiante.cedula }})</option>
                    {% endfor %}
                    {% else %}
                    <option value="">No hay estudiantes disponibles</option>
                    {% endif %}
                </select>
            </div>
            <button type="submit">Crear Dirección</button>
        </form>
    </div>
</body>

</html>
